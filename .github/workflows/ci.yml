name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Must precede setup-node: its `cache: pnpm` shells out to
      # `pnpm store path --silent` to locate the store to cache.
      #
      # `standalone` installs @pnpm/exe, which bundles its own Node. pnpm 11
      # itself requires Node >=22.13, but `node-version` below is deliberately
      # 22.12 — the floor declared in package.json's `engines` — so CI proves
      # the floor actually works. Without `standalone`, pnpm runs on the
      # runner's Node and aborts before a single test runs. The bundled Node
      # is used ONLY by pnpm; package scripts still resolve `node` from PATH,
      # i.e. the 22.12 that setup-node installed.
      - uses: pnpm/action-setup@v6
        with:
          version: 11.8.0
          standalone: true

      - uses: actions/setup-node@v7
        with:
          node-version: "22.12"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Guards the `standalone: true` above: @pnpm/exe's bundled Node must stay
      # pnpm's private business. If it ever leaked into PATH, every step below
      # would silently test a Node newer than the declared `engines` floor and
      # this job would stop proving what it exists to prove.
      - name: Package scripts run on the pinned Node, not pnpm's bundled one
        run: |
          set -euo pipefail
          pinned="$(node -v)"
          scripts="$(pnpm exec node -v)"
          echo "pnpm:              $(pnpm -v)"
          echo "node in PATH:      ${pinned}"
          echo "node for scripts:  ${scripts}"
          if [ "${scripts}" != "${pinned}" ]; then
            echo "package scripts are running on ${scripts}, not the pinned ${pinned}" >&2
            exit 1
          fi

      - name: Typecheck
        run: pnpm typecheck

      # Runs the suite ONCE and tees its combined output to a file, so the
      # pristine-output check below can inspect it without paying for a second
      # full `vitest run` (which also re-triggered every build side effect).
      # `pipefail` + PIPESTATUS keep a real test failure failing this step.
      - name: Test
        run: |
          set -euo pipefail
          set -o pipefail
          pnpm test 2>&1 | tee /tmp/vitest-output.txt
          exit "${PIPESTATUS[0]}"

      # Only meaningful because the step above already passed: a FAILING suite
      # prints assertion diffs that legitimately contain the word "fezoctl",
      # which this grep would misattribute as "a test is writing to a real
      # stream". Guarding on the previous step's success removes that
      # misdiagnosis.
      - name: Test output is pristine (no stray "fezoctl" lines on the runner)
        run: |
          set -euo pipefail
          count="$(grep -c fezoctl /tmp/vitest-output.txt || true)"
          echo "fezoctl mention count: ${count}"
          if [ "${count}" != "0" ]; then
            echo "vitest output is not pristine — a test is writing to a real stream instead of capturing it" >&2
            grep -n fezoctl /tmp/vitest-output.txt >&2 || true
            exit 1
          fi

      - name: Build the bundle
        run: pnpm bundle

      # BOTH committed bundles are gated. The skill-local copy is what
      # installers that take the skill directory alone (`npx skills add`, a
      # `cp -R`, a `.skill` archive) actually ship as the engine — a stale or
      # missing copy is an install that resolves no fezoctl at all.
      - name: Bundle freshness — fail if either committed bundle differs from a fresh build
        run: |
          set -euo pipefail
          test -f skills/fezo/scripts/fezoctl.mjs || {
            echo "skills/fezo/scripts/fezoctl.mjs is missing: it is committed, not generated on demand." >&2
            echo "Run 'pnpm bundle' and commit the result." >&2
            exit 1
          }
          if ! git diff --exit-code -- dist/fezoctl.mjs skills/fezo/scripts/fezoctl.mjs; then
            echo "A committed bundle is stale: commit the output of 'pnpm bundle'." >&2
            echo "NOTE: package.json's version is baked into the bundle at build time" >&2
            echo "(esbuild --define __FEZOCTL_VERSION__), so BUMPING THE VERSION ALONE" >&2
            echo "changes these bytes. If you just bumped package.json, this is expected:" >&2
            echo "run 'pnpm bundle' and 'pnpm gen-skill' and commit both artifacts." >&2
            exit 1
          fi

      - name: Generate the skill
        run: pnpm gen-skill

      - name: Skill freshness — fail if the committed SKILL.md differs from a fresh generation
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- skills/fezo/SKILL.md; then
            echo "skills/fezo/SKILL.md is stale: commit the output of 'pnpm gen-skill'." >&2
            echo "NOTE: SKILL.md's frontmatter version and baked-in SKILL_VERSION are" >&2
            echo "derived from package.json's version, so bumping the version alone" >&2
            echo "changes this file too." >&2
            exit 1
          fi

      - name: Generate the per-host plugin manifests
        run: pnpm gen-manifests

      # Same contract as SKILL.md and the bundles: these files are generated,
      # so a hand edit or a version bump without regeneration is a stale
      # manifest — a host that installs the plugin and reports a release number
      # that was never cut.
      - name: Manifest freshness — fail if any committed manifest differs from a fresh generation
        run: |
          set -euo pipefail
          paths="$(node build/gen-manifests.mjs --list)"
          echo "generated manifests:"
          echo "${paths}"
          # `git diff` reports NOTHING for an untracked path, so the freshness
          # check below would pass vacuously for a manifest that was generated
          # but never committed — a new host lane that silently never ships.
          # Assert tracked-ness first; only then is the diff meaningful.
          while IFS= read -r path; do
            git ls-files --error-unmatch "${path}" >/dev/null 2>&1 || {
              echo "${path} is not tracked by git: 'git add' it." >&2
              echo "Generated manifests must be committed — hosts read them from the repository." >&2
              exit 1
            }
          done <<< "${paths}"
          # Word-split is intended: --list emits one relative path per line and
          # none of them contain whitespace.
          # shellcheck disable=SC2086
          if ! git diff --exit-code -- ${paths}; then
            echo "A generated manifest is stale: run 'pnpm gen-manifests' and commit the result." >&2
            echo "NOTE: every manifest's version, description, and URLs are derived from" >&2
            echo "package.json and build/gen-skill.mjs — bumping the version alone changes" >&2
            echo "all of them. Do not hand-edit these files." >&2
            exit 1
          fi

      # The converse of the gate above, which can only ever check files the
      # generator still lists. Rename or drop a lane and the old file stays
      # committed and unlisted: never regenerated, never diffed, and still found
      # by the host that reads it — which then installs whatever version was
      # current when the lane went away.
      - name: No orphaned manifest — fail if a manifest in the tree is no longer generated
        run: |
          set -euo pipefail
          owned="$(node build/gen-manifests.mjs --list)"
          # Every tracked path shaped like a host manifest: a `*-plugin/` or
          # `.agents/plugins/` JSON file, or a root `*-extension.json`.
          candidates="$(git ls-files | grep -E '(^|/)[^/]*-plugin/.+\.json$|^\.agents/plugins/.+\.json$|^[^/]*-extension\.json$' || true)"
          # Not named `status`: that identifier is read-only in some shells, so a
          # local reproduction of this step would die on the assignment instead
          # of reporting orphans.
          orphans=0
          while IFS= read -r path; do
            [ -n "${path}" ] || continue
            if ! printf '%s\n' "${owned}" | grep -Fxq "${path}"; then
              echo "${path} looks like a host manifest but is not in 'gen-manifests --list'." >&2
              echo "Delete it, or restore the lane in build/gen-manifests.mjs that generates it." >&2
              orphans=1
            fi
          done <<< "${candidates}"
          exit "${orphans}"

      # ONE version number. The frontmatter `version` is the value baked in as
      # `SKILL_VERSION`, which pins tier 5 (`npx -y fezo-skills@$SKILL_VERSION`)
      # and drives tier 4's exact-match comparison — both PACKAGE facts. A
      # frontmatter version that drifts from package.json's pins a release that
      # cannot exist.
      - name: SKILL.md frontmatter version equals package.json's version
        run: |
          set -euo pipefail
          expected="$(node -p "require('./package.json').version")"
          frontmatter="$(sed -n 's/^version: *"\{0,1\}\([^"]*\)"\{0,1\} *$/\1/p' skills/fezo/SKILL.md | head -n 1)"
          baked="$(sed -n 's/^SKILL_VERSION="\(.*\)"$/\1/p' skills/fezo/SKILL.md | head -n 1)"
          echo "package.json: ${expected}"
          echo "frontmatter:  ${frontmatter}"
          echo "SKILL_VERSION: ${baked}"
          if [ -z "${frontmatter}" ] || [ -z "${baked}" ]; then
            echo "could not read the frontmatter version and/or the baked-in SKILL_VERSION from SKILL.md" >&2
            exit 1
          fi
          if [ "${frontmatter}" != "${expected}" ] || [ "${baked}" != "${expected}" ]; then
            echo "SKILL.md's version(s) disagree with package.json's version; the tier-5 npx pin" >&2
            echo "would name a package version that does not exist." >&2
            exit 1
          fi

      - name: Committed bundle --version matches package.json's version
        run: |
          set -euo pipefail
          built="$(node dist/fezoctl.mjs --version)"
          expected="fezoctl $(node -p "require('./package.json').version")"
          echo "built: ${built}"
          echo "expected: ${expected}"
          if [ "${built}" != "${expected}" ]; then
            echo "dist/fezoctl.mjs --version does not match package.json's version" >&2
            exit 1
          fi

      # The check above only exercises dist/fezoctl.mjs, which sits ONE level
      # below the package root and therefore always could find ../package.json.
      # The skill-local copy sits TWO levels below it and is the artifact most
      # users install, so it is asserted separately and explicitly.
      - name: Skill-local bundle --version matches package.json's version
        run: |
          set -euo pipefail
          test -f skills/fezo/scripts/fezoctl.mjs
          built="$(node skills/fezo/scripts/fezoctl.mjs --version)"
          expected="fezoctl $(node -p "require('./package.json').version")"
          echo "built: ${built}"
          echo "expected: ${expected}"
          if [ "${built}" != "${expected}" ]; then
            echo "skills/fezo/scripts/fezoctl.mjs --version does not match package.json's version." >&2
            echo "The version is injected at bundle time (esbuild --define); this copy cannot" >&2
            echo "read ../package.json because it lives two levels below the package root." >&2
            exit 1
          fi

      - name: Pack check
        run: pnpm pack:check
